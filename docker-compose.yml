services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-local-oracle-password}
      APP_USER: ${ORACLE_USERNAME:-medcore_app}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change-me}
    volumes:
      - medcore_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
volumes:
  medcore_oracle_data:

